[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allieos"
version = "0.1.0"
description = "Role configuration and image tooling for AllieOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "AllieOS contributors" }]
dependencies = []

[project.scripts]
alliectl = "allieos.cli:main"
allie-pathology = "allieos.pathology.server:main"

[tool.setuptools]
packages = ["allieos", "allieos.pathology"]
script-files = ["scripts/install-micromanager.sh", "scripts/install-pathology-platform.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
